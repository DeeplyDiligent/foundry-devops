<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Declarative Workflow Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #eee;
        }
        .container {
            width: 100%;
            max-width: 700px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            background: #16213e;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .header {
            padding: 16px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }
        .header .badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        .workflow-selector {
            padding: 12px 24px;
            background: #0f3460;
            border-bottom: 1px solid #1a4080;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .workflow-selector label {
            font-size: 13px;
            color: #aaa;
        }
        .workflow-selector select {
            background: #1a4080;
            color: #eee;
            border: 1px solid #2a5090;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: #2a2a4a;
            color: #eee;
            border-bottom-left-radius: 4px;
        }
        .message.error {
            align-self: center;
            background: #5c1a1a;
            color: #ff9999;
            font-size: 13px;
        }
        .message.system {
            align-self: center;
            background: transparent;
            color: #888;
            font-size: 12px;
            font-style: italic;
        }
        .typing {
            align-self: flex-start;
            padding: 12px 16px;
            background: #2a2a4a;
            border-radius: 12px;
            display: none;
        }
        .typing.active { display: flex; gap: 4px; }
        .typing span {
            width: 8px; height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .input-area {
            padding: 16px 24px;
            background: #0f3460;
            border-top: 1px solid #1a4080;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #2a5090;
            background: #1a4080;
            color: #eee;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-area input:focus {
            border-color: #667eea;
        }
        .input-area button {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .input-area button:hover { opacity: 0.9; }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Declarative Workflow Chat</h1>
            <span class="badge">agent-framework-declarative</span>
        </div>
        <div class="workflow-selector">
            <label>Workflow:</label>
            <select id="workflowSelect">
                <option value="purple-workflow" selected>purple-workflow</option>
            </select>
        </div>
        <div class="messages" id="messages">
            <div class="message system">Send a message to run it through the purple-workflow declarative pipeline.</div>
        </div>
        <div class="typing" id="typing">
            <span></span><span></span><span></span>
        </div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" />
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingEl = document.getElementById('typing');
        const workflowSelect = document.getElementById('workflowSelect');

        // Load available workflows
        fetch('/api/workflows')
            .then(r => r.json())
            .then(data => {
                workflowSelect.innerHTML = '';
                data.workflows.forEach(w => {
                    const opt = document.createElement('option');
                    opt.value = w;
                    opt.textContent = w;
                    if (w === 'purple-workflow') opt.selected = true;
                    workflowSelect.appendChild(opt);
                });
            })
            .catch(() => {});

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) sendMessage();
        });

        async function sendMessage() {
            const message = inputEl.value.trim();
            if (!message) return;

            // Add user message
            addMessage(message, 'user');
            inputEl.value = '';
            sendBtn.disabled = true;
            typingEl.classList.add('active');

            const workflow = workflowSelect.value;

            try {
                const res = await fetch(`/api/run-workflow/${workflow}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message }),
                });

                if (!res.ok) {
                    const err = await res.json();
                    addMessage(err.detail || 'Request failed', 'error');
                } else {
                    const data = await res.json();
                    addMessage(data.response, 'assistant');
                }
            } catch (e) {
                addMessage(`Network error: ${e.message}`, 'error');
            } finally {
                sendBtn.disabled = false;
                typingEl.classList.remove('active');
            }
        }

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
    </script>
</body>
</html>
